<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Кабинет — Алишер Каримов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col justify-between">

  <!-- ХЕДЕР -->
  <header class="border-b border-emerald-900/40 bg-slate-950/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-950/80 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-xl shadow-lg">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>
        <div>
          <h1 class="text-lg font-black text-white tracking-tight uppercase">АЛИШЕР КАРИМОВ</h1>
          <span class="block text-[10px] text-emerald-400 font-semibold tracking-widest uppercase" id="subRole">Личный кабинет адвоката</span>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="toggleLang()" class="bg-emerald-950/60 border border-emerald-800/60 hover:border-emerald-500 text-emerald-300 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center space-x-1">
          <i class="fa-solid fa-globe text-emerald-400"></i>
          <span id="langBtnText">O'ZB</span>
        </button>

        <div class="flex items-center space-x-2 bg-emerald-950/40 border border-emerald-800/40 px-3 py-1.5 rounded-xl">
          <span class="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
          <span class="text-xs font-bold text-emerald-300" id="onlineText">Онлайн</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- ПАНЕЛЬ СТАТИСТИКИ -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900/80 border border-emerald-900/30 rounded-2xl p-4 flex flex-col justify-between">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" id="statNewLabel">Новые заявки</span>
        <div class="text-3xl font-black text-emerald-400 mt-2" id="statNew">0</div>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" id="statArchivedLabel">В архиве</span>
        <div class="text-3xl font-black text-slate-400 mt-2" id="statArchived">0</div>
      </div>
      <div class="col-span-2 sm:col-span-1 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" id="statTotalLabel">Всего обращений</span>
        <div class="text-3xl font-black text-white mt-2" id="statTotal">0</div>
      </div>
    </div>

    <!-- ТАБЫ / ФИЛЬТРЫ -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div class="flex space-x-2">
        <button id="tabNew" onclick="switchTab('new')" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20 transition">
          Новые заявки
        </button>
        <button id="tabArchive" onclick="switchTab('archived')" class="px-5 py-2.5 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition">
          Архив
        </button>
      </div>
    </div>

    <!-- СПИСОК ЗАЯВОК -->
    <div id="leadsList" class="space-y-4"></div>

  </main>

  <footer class="border-t border-slate-900 bg-slate-950 py-4 text-center text-xs text-slate-600" id="footerText">
    Система управления заявками • Кабинет Каримова А.
  </footer>

  <script>
    const socket = io();
    let currentTab = 'new';
    let allLeads = [];
    let currentLang = 'ru';

    const dict = {
      ru: {
        subRole: "Личный кабинет адвоката",
        onlineText: "Онлайн",
        statNewLabel: "Новые заявки",
        statArchivedLabel: "В архиве",
        statTotalLabel: "Всего обращений",
        tabNew: "Новые заявки",
        tabArchive: "Архив",
        emptyText: "Заявок в этой категории не найдено",
        callBtn: "Позвонить",
        toArchive: "В архив",
        toRestore: "Восстановить",
        deleteBtn: "Удалить",
        descLabel: "Суть обращения:",
        noDesc: "Клиент не указал подробностей",
        footerText: "Система управления заявками • Кабинет Каримова А.",
        langBtn: "O'ZB"
      },
      uz: {
        subRole: "Advokat shaxsiy kabineti",
        onlineText: "Tarmoqda",
        statNewLabel: "Yangi arizalar",
        statArchivedLabel: "Arxivda",
        statTotalLabel: "Jami murojaatlar",
        tabNew: "Yangi arizalar",
        tabArchive: "Arxiv",
        emptyText: "Ushbu bo'limda arizalar topilmadi",
        callBtn: "Qo'ng'iroq qilish",
        toArchive: "Arxivga",
        toRestore: "Tiklash",
        deleteBtn: "O'chirish",
        descLabel: "Murojaat mazmuni:",
        noDesc: "Mijoz tafsilotlarni ko'rsatmagan",
        footerText: "Arizalarni boshqarish tizimi • Karimov A. kabineti",
        langBtn: "РУС"
      }
    };

    function toggleLang() {
      currentLang = currentLang === 'ru' ? 'uz' : 'ru';
      applyLang();
    }

    function applyLang() {
      const d = dict[currentLang];
      document.getElementById('langBtnText').innerText = d.langBtn;
      document.getElementById('subRole').innerText = d.subRole;
      document.getElementById('onlineText').innerText = d.onlineText;
      document.getElementById('statNewLabel').innerText = d.statNewLabel;
      document.getElementById('statArchivedLabel').innerText = d.statArchivedLabel;
      document.getElementById('statTotalLabel').innerText = d.statTotalLabel;
      document.getElementById('footerText').innerText = d.footerText;
      switchTab(currentTab);
    }

    function switchTab(tab) {
      currentTab = tab;
      const d = dict[currentLang];
      
      const tabNew = document.getElementById('tabNew');
      const tabArchive = document.getElementById('tabArchive');

      tabNew.innerText = d.tabNew;
      tabArchive.innerText = d.tabArchive;

      if (tab === 'new') {
        tabNew.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20 transition";
        tabArchive.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition";
      } else {
        tabArchive.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20 transition";
        tabNew.className = "px-5 py-2.5 rounded-xl font-bold text-xs bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition";
      }

      renderLeads();
    }

    async function loadLeads() {
      try {
        const res = await fetch('/api/leads?status=new');
        const newLeads = await res.json();

        const resArch = await fetch('/api/leads?status=archived');
        const archivedLeads = await resArch.json();

        const karimovNew = newLeads.filter(l => l.description && l.description.includes('[ID:karimov]'));
        const karimovArchived = archivedLeads.filter(l => l.description && l.description.includes('[ID:karimov]'));

        allLeads = [...karimovNew, ...karimovArchived];

        document.getElementById('statNew').innerText = karimovNew.length;
        document.getElementById('statArchived').innerText = karimovArchived.length;
        document.getElementById('statTotal').innerText = allLeads.length;

        renderLeads();
      } catch (err) {
        console.error('Ошибка загрузки:', err);
      }
    }

    function renderLeads() {
      const list = document.getElementById('leadsList');
      list.innerHTML = '';
      const d = dict[currentLang];

      const filtered = allLeads.filter(l => l.status === currentTab);

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-12 text-center text-slate-500 space-y-2">
            <i class="fa-solid fa-folder-open text-3xl mb-2 text-slate-600 block"></i>
            <p class="text-sm font-medium">${d.emptyText}</p>
          </div>
        `;
        return;
      }

      filtered.forEach(lead => {
        const card = document.createElement('div');
        card.className = "bg-slate-900/90 border border-emerald-900/30 hover:border-emerald-500/40 transition rounded-2xl p-5 shadow-xl space-y-4";
        
        const dateObj = new Date(lead.created_at);
        const timeStr = dateObj.toLocaleTimeString("ru-RU", { timeZone: "Asia/Tashkent", hour: '2-digit', minute:'2-digit' });
        const dateStr = dateObj.toLocaleDateString("ru-RU", { timeZone: "Asia/Tashkent", day: '2-digit', month: '2-digit', year: 'numeric' });

        const cleanText = lead.description.replace(/\[ID:.*?\]/g, '').replace(/\[Адвокат:.*?\]/g, '').trim();

        let actionButtons = '';
        if (currentTab === 'new') {
          actionButtons = `
            <button onclick="changeStatus(${lead.id}, 'archived')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2.5 rounded-xl text-xs transition border border-slate-700">
              ${d.toArchive}
            </button>
          `;
        } else {
          actionButtons = `
            <div class="flex space-x-2">
              <button onclick="changeStatus(${lead.id}, 'new')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2.5 rounded-xl text-xs transition border border-slate-700">
                ${d.toRestore}
              </button>
              <button onclick="deleteLead(${lead.id})" class="bg-rose-950/80 hover:bg-rose-900 text-rose-400 font-semibold px-4 py-2.5 rounded-xl text-xs transition border border-rose-800/60">
                <i class="fa-solid fa-trash-can mr-1"></i>${d.deleteBtn}
              </button>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-b border-slate-800/80 pb-3">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-sm font-bold">
                <i class="fa-solid fa-user"></i>
              </div>
              <div>
                <h3 class="text-base font-bold text-white">${lead.client_name}</h3>
                <p class="text-xs text-emerald-400 font-semibold mt-0.5">
                  <i class="fa-solid fa-phone text-[10px] mr-1"></i>${lead.client_phone}
                </p>
              </div>
            </div>
            <div class="text-left sm:text-right text-[11px] text-slate-400 font-mono">
              <span>${dateStr}</span> • <span class="text-emerald-400 font-bold">${timeStr}</span>
            </div>
          </div>

          <div class="bg-slate-950/60 border border-slate-800/60 rounded-xl p-3 text-xs text-slate-300 leading-relaxed">
            <span class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">${d.descLabel}</span>
            ${cleanText || d.noDesc}
          </div>

          <div class="flex items-center justify-between pt-1 gap-2">
            <a href="tel:${lead.client_phone}" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs uppercase tracking-wider transition flex items-center space-x-2 shadow-lg shadow-emerald-500/10">
              <i class="fa-solid fa-phone"></i>
              <span>${d.callBtn}</span>
            </a>

            ${actionButtons}
          </div>
        `;

        list.appendChild(card);
      });
    }

    async function changeStatus(id, status) {
      await fetch(`/api/leads/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadLeads();
    }

    async function deleteLead(id) {
      const confirmMsg = currentLang === 'ru' ? 'Вы уверены, что хотите удалить эту заявку?' : 'Ushbu arizani o\'chirishga ishonchingiz komilmi?';
      if (!confirm(confirmMsg)) return;

      await fetch(`/api/leads/${id}`, {
        method: 'DELETE'
      });
      loadLeads();
    }

    socket.on('new_lead', () => loadLeads());
    socket.on('update_lead', () => loadLeads());
    socket.on('delete_lead', () => loadLeads());

    loadLeads();
  </script>
</body>
</html>
