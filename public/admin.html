<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>advokatuz — Панель управления заявками</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #080f0e; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .card-bg { background-color: #0d1a18; border: 1px solid #162e2a; }
    .new-lead-anim { animation: pulseBg 2s ease-out; }
    @keyframes pulseBg {
      0% { background-color: rgba(16, 185, 129, 0.3); }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="p-4 sm:p-8 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Шапка админки -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 card-bg p-6 rounded-2xl">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-3">
          <span>⚖ Панель заявок</span>
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
            <span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5 animate-ping"></span> Live Realtime
          </span>
        </h1>
        <p class="text-xs text-slate-400 mt-1">Новые заявки поступают автоматически без перезагрузки страницы</p>
      </div>
      <div class="text-right">
        <span class="text-xs text-slate-400 block">Всего заявок:</span>
        <span id="totalLeadsCount" class="text-2xl font-bold text-emerald-400">0</span>
      </div>
    </div>

    <!-- Таблица заявок -->
    <div class="card-bg rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-[#080f0e] text-xs uppercase tracking-wider text-slate-400 border-b border-[#162e2a]">
            <tr>
              <th class="p-4">ID</th>
              <th class="p-4">Дата / Время</th>
              <th class="p-4">Клиент</th>
              <th class="p-4">Телефон</th>
              <th class="p-4">Описание / Адвокат</th>
              <th class="p-4 text-center">Статус</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody" class="divide-y divide-[#162e2a]">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-500">Загрузка заявок...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const socket = io();
    let leadsList = [];

    // Мгновенный приём новой заявки по WebSockets без нажатия кнопок!
    socket.on('newLead', (lead) => {
      leadsList.unshift(lead);
      renderTable();
      playNotificationSound();
    });

    // Первоначальная загрузка
    async function loadLeads() {
      try {
        const res = await fetch('/api/leads');
        leadsList = await res.json();
        renderTable();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('leadsTableBody');
      document.getElementById('totalLeadsCount').innerText = leadsList.length;

      if (leadsList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Заявок пока нет</td></tr>`;
        return;
      }

      tbody.innerHTML = leadsList.map((lead, index) => {
        const dateStr = new Date(lead.created_at || Date.now()).toLocaleString('ru-RU', { timeZone: 'Asia/Tashkent' });
        const isNew = index === 0 ? 'new-lead-anim' : '';
        return `
          <tr class="${isNew} hover:bg-[#162e2a]/30 transition">
            <td class="p-4 font-mono text-xs text-slate-400">#${lead.id}</td>
            <td class="p-4 text-xs text-slate-300 whitespace-nowrap">${dateStr}</td>
            <td class="p-4 font-bold text-white">${lead.client_name}</td>
            <td class="p-4 text-emerald-400 font-mono font-bold">${lead.client_phone}</td>
            <td class="p-4 text-xs text-slate-300 max-w-xs break-words">${lead.description || '-'}</td>
            <td class="p-4 text-center">
              <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Новая</span>
            </td>
          </tr>
        `;
      }).join('');
    }

    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 587.33; // D5
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    loadLeads();
  </script>
</body>
</html>
