<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет И. Азимова — ADVOKATUZ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between antialiased">

  <!-- ШАПКА -->
  <header class="border-b border-slate-800/80 bg-slate-950/90 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-black text-xl shadow-lg">
          <i class="fa-solid fa-scale-balanced"></i>
        </div>
        <div>
          <span class="text-xl font-black text-white tracking-widest uppercase block leading-none">ADVOKAT<span class="text-emerald-400">UZ</span></span>
          <span class="text-xs text-emerald-400 font-semibold" id="cabinetOwner">Кабинет адвоката И. Азимова</span>
        </div>
      </div>

      <!-- КНОПКА СМЕНЫ ЯЗЫКА -->
      <button onclick="toggleLang()" class="bg-slate-900 border border-slate-800 hover:border-slate-600 text-slate-300 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center space-x-1">
        <i class="fa-solid fa-globe text-emerald-400"></i>
        <span id="langBtnText">O'ZB</span>
      </button>
    </div>
  </header>

  <!-- КОНТЕНТ -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

    <!-- КАРТОЧКИ СТАТИСТИКИ -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
        <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider block mb-1" id="statTotalLabel">Всего заявок</span>
        <span class="text-3xl font-black text-white" id="statTotal">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
        <span class="text-xs text-emerald-400 font-semibold uppercase tracking-wider block mb-1" id="statNewLabel">Новые</span>
        <span class="text-3xl font-black text-emerald-400" id="statNew">0</span>
      </div>
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
        <span class="text-xs text-blue-400 font-semibold uppercase tracking-wider block mb-1" id="statDoneLabel">Завершенные</span>
        <span class="text-3xl font-black text-blue-400" id="statDone">0</span>
      </div>
    </div>

    <!-- ТАБЛИЦА ЗАЯВОК -->
    <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-bold text-white text-lg" id="tableTitle">Заявки клиентов</h2>
        <span class="text-xs text-slate-500" id="autoUpdateText">Режим реального времени</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-xs text-slate-400 uppercase tracking-wider border-b border-slate-800">
            <tr>
              <th class="p-4">ID</th>
              <th class="p-4" id="thClient">Клиент</th>
              <th class="p-4" id="thPhone">Телефон</th>
              <th class="p-4" id="thDesc">Описание</th>
              <th class="p-4" id="thStatus">Статус</th>
              <th class="p-4" id="thDate">Дата</th>
              <th class="p-4 text-right" id="thActions">Действия</th>
            </tr>
          </thead>
          <tbody id="leadsTableBody" class="divide-y divide-slate-800/50">
            <!-- Данные загружаются через JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    const socket = io();
    let currentLang = 'ru';
    let allLeads = [];

    const dict = {
      ru: {
        langBtn: "O'ZB",
        cabinetOwner: "Кабинет адвоката И. Азимова",
        statTotalLabel: "Всего заявок",
        statNewLabel: "Новые",
        statDoneLabel: "Завершенные",
        tableTitle: "Заявки клиентов",
        autoUpdateText: "Режим реального времени",
        thClient: "Клиент",
        thPhone: "Телефон",
        thDesc: "Описание",
        thStatus: "Статус",
        thDate: "Дата",
        thActions: "Действия",
        statusNew: "Новая",
        statusInWork: "В работе",
        statusDone: "Завершено",
        emptyTable: "Заявок пока нет"
      },
      uz: {
        langBtn: "РУС",
        cabinetOwner: "Advokat I. Azimov kabineti",
        statTotalLabel: "Jami arizalar",
        statNewLabel: "Yangilar",
        statDoneLabel: "Yakunlangan",
        tableTitle: "Mijozlar arizalari",
        autoUpdateText: "Reallik rejimida yangilanish",
        thClient: "Mijoz",
        thPhone: "Telefon",
        thDesc: "Tavsif",
        thStatus: "Holat",
        thDate: "Sana",
        thActions: "Harakatlar",
        statusNew: "Yangi",
        statusInWork: "Jarayonda",
        statusDone: "Yakunlandi",
        emptyTable: "Arizalar hali yo'q"
      }
    };

    function toggleLang() {
      currentLang = currentLang === 'ru' ? 'uz' : 'ru';
      applyLang();
      renderLeads();
    }

    function applyLang() {
      const d = dict[currentLang];
      document.getElementById('langBtnText').innerText = d.langBtn;
      document.getElementById('cabinetOwner').innerText = d.cabinetOwner;
      document.getElementById('statTotalLabel').innerText = d.statTotalLabel;
      document.getElementById('statNewLabel').innerText = d.statNewLabel;
      document.getElementById('statDoneLabel').innerText = d.statDoneLabel;
      document.getElementById('tableTitle').innerText = d.tableTitle;
      document.getElementById('autoUpdateText').innerText = d.autoUpdateText;
      document.getElementById('thClient').innerText = d.thClient;
      document.getElementById('thPhone').innerText = d.thPhone;
      document.getElementById('thDesc').innerText = d.thDesc;
      document.getElementById('thStatus').innerText = d.thStatus;
      document.getElementById('thDate').innerText = d.thDate;
      document.getElementById('thActions').innerText = d.thActions;
    }

    async function loadLeads() {
      try {
        const res = await fetch('/api/leads');
        const data = await res.json();
        // Фильтруем заявки адресованные Азимову
        allLeads = data.filter(lead => lead.description.includes('[ID:azimov]'));
        renderLeads();
      } catch (err) {
        console.error(err);
      }
    }

    function renderLeads() {
      const tbody = document.getElementById('leadsTableBody');
      tbody.innerHTML = '';

      const d = dict[currentLang];

      let countNew = 0;
      let countDone = 0;

      if (allLeads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500">${d.emptyTable}</td></tr>`;
      }

      allLeads.forEach(lead => {
        if (lead.status === 'new') countNew++;
        if (lead.status === 'done') countDone++;

        const cleanDesc = lead.description.replace(/\[ID:.*?\]/g, '').trim();
        const dateStr = new Date(lead.created_at).toLocaleString();

        let statusBadge = '';
        if (lead.status === 'new') statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-md text-xs font-semibold">${d.statusNew}</span>`;
        else if (lead.status === 'in_progress') statusBadge = `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-md text-xs font-semibold">${d.statusInWork}</span>`;
        else statusBadge = `<span class="bg-slate-500/10 text-slate-400 border border-slate-500/30 px-2 py-1 rounded-md text-xs font-semibold">${d.statusDone}</span>`;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-900/50 transition';
        tr.innerHTML = `
          <td class="p-4 font-mono text-slate-500">#${lead.id}</td>
          <td class="p-4 font-bold text-white">${lead.client_name}</td>
          <td class="p-4 text-emerald-400 font-mono">${lead.client_phone}</td>
          <td class="p-4 max-w-xs truncate">${cleanDesc || '-'}</td>
          <td class="p-4">${statusBadge}</td>
          <td class="p-4 text-xs text-slate-500">${dateStr}</td>
          <td class="p-4 text-right space-x-2">
            <button onclick="updateStatus(${lead.id}, 'in_progress')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-clock text-emerald-400"></i></button>
            <button onclick="updateStatus(${lead.id}, 'done')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg transition"><i class="fa-solid fa-check text-blue-400"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('statTotal').innerText = allLeads.length;
      document.getElementById('statNew').innerText = countNew;
      document.getElementById('statDone').innerText = countDone;
    }

    async function updateStatus(id, status) {
      await fetch(`/api/leads/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      loadLeads();
    }

    socket.on('new_lead', () => loadLeads());
    socket.on('update_lead', () => loadLeads());

    loadLeads();
  </script>
</body>
</html>
